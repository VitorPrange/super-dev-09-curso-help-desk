<app-modal
    titulo="Cancelar Ticket"
    [aberto]="aberto()"
    [fecharAoClicarFora]="false"
    (fechar)="aoFechar()">

    <div class="form-modal">
        <div>
            <span class="rotulo">Ticket</span>
            <p class="valor-fixo">{{ticket()?.numeroProtocolo}} — {{ticket()?.titulo}}</p>
        </div>

        <div>
            <label for="campo-usuario-cancelamento">Usuário</label>
            <!-- sem filtro por papel: a api aceita solicitante e atendente -->
            <select id="campo-usuario-cancelamento" [(ngModel)]="dado.idUsuario">
                @for(usuario of usuarios(); track usuario.id){
                    <option [ngValue]="usuario.id">{{usuario.nome}}</option>
                }
            </select>
        </div>

        <div>
            <label for="campo-motivo">Motivo do cancelamento</label>
            <textarea id="campo-motivo"
                [maxlength]="motivoMaximo"
                placeholder="Por que este ticket está sendo cancelado?"
                [(ngModel)]="dado.motivo"></textarea>
            <span class="contador">{{dado.motivo.length}}/{{motivoMaximo}}</span>
        </div>

        @if(erro()){
            <p class="erro">{{erro()}}</p>
        }
    </div>

    <!-- botões (rodapé da modal) -->
    <button modal-acoes class="secundario"
        (click)="aoFechar()">Voltar</button>
    <button modal-acoes class="perigo"
        [disabled]="salvando()" (click)="salvar()">Cancelar Ticket</button>
</app-modal>
